; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;

; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32@7.1.2
board = esp32doit-devkit-v1
framework = arduino
; Fix IntelliSense errors: generate compile_commands.json for clangd
; generate_compiledb = yes
; Giảm tốc độ upload để kết nối ổn định hơn (giải quyết lỗi "No serial data")
upload_speed = 115200
; ⚠️ QUAN TRỌNG: Dùng partition "no_ota" để cấp đủ bộ nhớ cho Bluetooth Classic + A2DP
; Sketch dùng cả A2DP + SPP + TFT rất nặng (~1.4MB), cần partition lớn hơn mặc định
board_build.partitions = no_ota.csv
; Tắt PSRAM nếu board không có (ESP32 DoIt DevKit thường không có PSRAM)
build_flags =
  ; BOARD_HAS_PSRAM must be undefined on this board.
monitor_speed = 115200
lib_deps = 
	https://github.com/pschatzmann/ESP32-A2DP.git
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit TouchScreen@^1.1.6
	adafruit/RTClib@^2.1.4
	; Phase 1: WiFi/MQTT + JSON
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21

; [env:test]
; platform = native
; test_framework = unity
; build_src_filter = +<pomodoro_engine.cpp> +<timer_engine.cpp>
