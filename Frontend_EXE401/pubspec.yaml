name: eink_clock
description: "Ứng dụng điều khiển đồng hồ Eink Clock qua Bluetooth BLE"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.36.1
  provider: ^6.1.2
  go_router: ^14.6.3
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  intl: ^0.20.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
