name: eink_clock
description: "Ứng dụng POMO SMART - Đồng hồ thông minh Pomodoro IoT"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  go_router: ^14.6.3
  shared_preferences: ^2.3.5
  path_provider: ^2.1.6
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  intl: ^0.20.2
  http: ^1.6.0
  # Bluetooth Low Energy - Nhan data tu ESP32 (song song voi A2DP Classic cho loa)
  flutter_blue_plus: ^1.36.1
  # Phase 1 - AI Productivity additions
  fl_chart: ^0.69.0
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/samples/
